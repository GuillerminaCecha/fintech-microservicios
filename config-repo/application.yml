# Configuración COMPARTIDA por todos los servicios que leen del Config Server
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
